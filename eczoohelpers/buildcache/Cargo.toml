# The WebAssembly binding of cachette for the zoo builder.  The compiled
# output is committed in dist/; rebuild it with `yarn build` (tools/build.mjs)
# after changing this crate or the version of cachette.  See README.md.

[package]
name = "buildcache"
version = "0.0.1"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
cachette = { version = "0.1", default-features = false, features = ["std"] }
serde_json = "1"
wasm-bindgen = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"

# A crate of its own, not a member of any enclosing workspace.
[workspace]
